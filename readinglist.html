<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>grflows' reading list</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                padding: 5rem 1.5rem;
                background: linear-gradient(145deg, rgb(255, 240, 206) 0%, rgb(255, 244, 221) 100%);
                background-attachment: fixed;
                color: #2f2a22;
                font-family: sans-serif;
                font-optical-sizing: auto;
                line-height: 1.6;
            }

            main {
                max-width: 560px;
                margin: 0 auto;
            }

            h1 {
                font-size: 1.6rem;
                font-weight: 600;
                margin-bottom: 2rem;
            }

            ul {
                list-style: none;
            }

            li {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 1.5rem;
                padding: 0.9rem 0;
                border-bottom: 1px solid rgba(47, 42, 34, 0.12);
            }

            li:first-child {
                border-top: 1px solid rgba(47, 42, 34, 0.12);
            }

            a {
                text-decoration: none;
                color: #24221f;
            }

            .category {
                flex-shrink: 0;
                font-size: 0.8rem;
                color: #8a8071;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Reading list</h1>
            <ul>
                <li>
                    <a href="https://briancallahan.net/blog/20210814.html">Let's write a compiler - Brian R Callahan</a>
                    <span class="category">programming</span>
                </li>
                <li>
                <a href="https://www.kafka-online.info/before-the-law.html"> before the law - Kafka</a>
                <span class="category">classical ficition</span>
                </li>
            </ul>
        </main>
    </body>
</html>
