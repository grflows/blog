<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HonestObjects</title>
  <style>
    /* minimal, beautiful, and centered */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #faf9f7;
      /* subtle texture: faint radial glow */
      background-image: radial-gradient(circle at 20% 30%, rgba(230, 225, 215, 0.4) 0%, transparent 35%),
        radial-gradient(circle at 90% 70%, rgba(210, 200, 185, 0.3) 0%, transparent 40%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #2e2a24;
      line-height: 1.2;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* main container – nothing extra, just the name */
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: gentleAppear 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 5.8rem);
      font-weight: 350;
      letter-spacing: -0.02em;
      word-spacing: 0.05em;
      color: #1f1c18;
      margin-bottom: 0.2em;
      line-height: 1.1;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.02);
      /* optical alignment */
      padding-left: 0.05em;
    }

    /* optional tiny accent – but it's just the header, so no extra text */
    /* we keep it ultra minimal, nothing else */

    /* subtle appear animation */
    @keyframes gentleAppear {
      0% {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(1px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* selection color – nice touch */
    ::selection {
      background: #d9d2c5;
      color: #1f1c18;
    }

    /* fine tune for very small screens */
    @media (max-width: 400px) {
      h1 {
        font-size: 2.8rem;
        letter-spacing: -0.01em;
      }
    }

    /* smooth focus outline for accessibility if needed */
    h1:focus-visible {
      outline: 2px solid #b0a89a;
      outline-offset: 8px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <!-- the one and only element – the header with honest objects -->
  <div class="landing">
    <h1>HonestObjects</h1>
  </div>
</body>

</html>
