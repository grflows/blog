<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grflow's blog</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, rgb(255, 240, 206) 0%, rgb(255, 244, 221) 100%);
      font-family: "Caveat", cursive;
      font-optical-sizing: auto;
      font-size: medium;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #2e2a24;
      line-height: 1.2;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: gentleAppear 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      width: 100%;
      max-width: 520px;
      gap: 2.4rem;
    }

    h1 {
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      font-weight: 350;
      letter-spacing: -0.02em;
      word-spacing: 0.05em;
      color: #1f1c18;
      line-height: 1.1;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.02);
      padding-left: 0.05em;
    }

    /* plain, minimal list of posts */
    .posts {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      font-size: 1.15rem;
      font-weight: 350;
      letter-spacing: -0.01em;
      color: #2e2a24;
    }

    .posts li {
      transition: color 0.2s ease;
    }

    .posts li:hover {
      color: #1f1c18;
    }

    /* footer */
    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 350;
      letter-spacing: 0.02em;
      color: #7a736a;
      margin-top: 1rem;
    }

    footer a {
      color: #7a736a;
      text-decoration: none;
      transition: color 0.2s ease;
      border-bottom: 1px solid transparent;
    }

    footer a:hover {
      color: #1f1c18;
      border-bottom-color: #c9c1b6;
    }

    @keyframes gentleAppear {
      0% {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(1px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    ::selection {
      background: #d9d2c5;
      color: #1f1c18;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 2rem;
      }

      .landing {
        gap: 1.8rem;
      }

      .posts {
        font-size: 1rem;
        gap: 0.7rem;
      }
    }
  </style>
</head>

<body>
  <div class="landing">
    <h1>grflow's blog</h1>

    <ul class="posts">
      <li>the quiet art of noticing</li>
      <li>building honest objects</li>
      <li>what's this blog about?</li>
    </ul>
    <footer>
      <a href="mailto:goldenriverflows@mailbox.org">𓂃✍︎ email</a>
      <p>𖡼.𖤣𖥧𖡼.𖤣𖥧</p>
      <a href="https://twitter.com/grflows0" target="_blank" rel="noopener noreferrer">♡ twitter</a>
    </footer>
  </div>
</body>

</html>
